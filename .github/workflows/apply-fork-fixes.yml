name: Apply fork fixes

on:
  push:
    branches:
      - fix/project1-geometry-and-dark-figures
    paths:
      - tools/apply_fork_fixes.py
      - .github/workflows/apply-fork-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project1-geometry-and-dark-figures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Apply documentation, reference-output, and PNG fixes
        run: python tools/apply_fork_fixes.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix geometry enumeration and dark-mode PNGs"
          git push origin HEAD:fix/project1-geometry-and-dark-figures
