name: Apply repository fixes

on:
  push:
    branches:
      - fix/repository-wide-audit
    paths:
      - tools/apply_repo_fixes.py
      - .github/workflows/apply-repository-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-wide-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Apply fixes
        run: python tools/apply_repo_fixes.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix repository-wide tutorial issues"
          git push origin HEAD:fix/repository-wide-audit
